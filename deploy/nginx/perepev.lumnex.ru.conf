# Перепев за nginx хоста: https://perepev.lumnex.ru → 127.0.0.1:8097 (контейнер web: Caddy
# со статикой и /api). Устанавливает deploy/nginx/install-site.sh (sudo) в
# /etc/nginx/sites-available/perepev.lumnex.ru.conf; сертификат certbot --cert-name perepev.
# HSTS и прочие заголовки безопасности добавляет Caddy, здесь они не дублируются.

server {
    listen 80;
    listen [::]:80;
    server_name perepev.lumnex.ru;
    access_log off;

    # HTTP-01 (certbot --webroot) и его продление; при DNS-01 не используется, но не мешает.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/perepev-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://perepev.lumnex.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name perepev.lumnex.ru;
    # Адреса клиентов в журнал доступа не пишутся: приложение хранит IP не дольше часа
    # (политика и выгрузка данных), а у журнала nginx хоста свои сроки. Журнал ошибок
    # (error_log по умолчанию) остаётся.
    access_log off;

    ssl_certificate     /etc/letsencrypt/live/perepev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perepev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # Свои треки до 12 МБ и файлы GPU-обработчика до 20 МБ; точные пределы проверяет API.
    client_max_body_size 25m;

    # Заголовки повторены в каждом location: proxy_set_header внутри location отменяет
    # унаследованные с уровня server. X-Forwarded-For перезаписывается адресом клиента:
    # присланное клиентом значение отбрасывается, а Caddy доверяет только этому переходу.

    # Живые дуэли: WebSocket держится весь матч, вкладка в фоне может долго молчать.
    location = /api/ws {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # API: long-poll аренды обработчика (до 25 с) и загрузки файлов идут потоком,
    # без буферизации на диске nginx.
    location /api/ {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Сайт, песни, шрифты.
    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
