name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-trixie
        env: { POSTGRES_USER: runner, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: perepev_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2-trixie
        ports: ["6379:6379"]
    env:
      PGHOST: localhost
      PGUSER: runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.99.0, targets: wasm32-unknown-unknown, components: "clippy, rustfmt" }
      - uses: actions/setup-node@v4
        with: { node-version: 26.11.1, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client valkey-tools || sudo apt-get install -y redis-tools
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Rust — паритет ядра, модульные тесты, clippy
        run: |
          cargo test --release --workspace
          cargo clippy --release --workspace --all-targets -- -D warnings
      - name: Контракты не устарели
        run: |
          ./target/release/perepev-api schemas contracts
          cd web && npm ci && node scripts/gen-types.mjs
          git diff --exit-code -- ../contracts src/lib/api/types.ts
      - name: Frontend — типы, паритет WASM, сборка
        working-directory: web
        run: |
          npm run check
          npm test
          npx vite build
      - name: Интеграция — два экземпляра, отказы, миграция
        run: node --test --test-concurrency=1 tests/integration/
        env:
          TEST_DATABASE_URL: postgres://runner@localhost/perepev_test
