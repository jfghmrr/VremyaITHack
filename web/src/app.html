<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Перепев — караоке-дуэли, где побеждает точность мелодии, а не высота голоса." />
    <meta name="theme-color" content="#171719" />
    <!-- Превью ссылки в Telegram, VK и мессенджерах (сайт и ссылки-вызовы #echo=…: фрагмент
         адреса краулеры не читают, поэтому превью общее). Картинка: scripts/og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Перепев" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Перепев — караоке, где твой голос имеет значение" />
    <meta property="og:description" content="Спой песню в своей тональности, получи разбор мелодии и ритма и вызови друга на дуэль." />
    <meta property="og:url" content="https://perepev.lumnex.ru/" />
    <meta property="og:image" content="https://perepev.lumnex.ru/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Логотип «Перепев», чёрный кот в красных наушниках в кресле и слоган «Караоке, где твой голос имеет значение»" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Перепев — караоке, где твой голос имеет значение" />
    <meta name="twitter:description" content="Спой песню в своей тональности, получи разбор мелодии и ритма и вызови друга на дуэль." />
    <meta name="twitter:image" content="https://perepev.lumnex.ru/og-image.jpg" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="%sveltekit.assets%/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <link rel="preload" href="%sveltekit.assets%/fonts/GolosText.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%sveltekit.assets%/fonts/Caveat.woff2" as="font" type="font/woff2" crossorigin />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
